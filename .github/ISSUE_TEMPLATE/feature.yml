name: Idea
description: Suggest a change to the review app
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What is missing
      description: What you cannot do today, or what is hard.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true
