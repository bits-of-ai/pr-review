name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Do not include tokens or API keys.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser, GitHub Pages URL or localhost
