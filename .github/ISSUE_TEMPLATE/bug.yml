name: Bug
description: Something on the site or in a review is wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to repeat it
      description: Steps, PR link (public only), browser. Do not paste GitHub tokens or AI keys.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site (pr-review.razonkumar.workers.dev)
        - On my computer (wrangler dev)
        - Tests / GitHub Actions
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Sign in with GitHub
        - Personal access token
        - Loading a pull request
        - Running a review
        - Copy or comment on the PR
        - Something else
    validations:
      required: true
