name = "pr-review"
main = "src/index.js"
compatibility_date = "2026-05-03"

# Git-connected Cloudflare projects run `npx wrangler deploy`.
# Static UI is public/; API routes are handled by src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Put GITHUB_CLIENT_ID in the Cloudflare dashboard, not here.
# An empty value in this file would wipe the dashboard value on deploy.
[vars]
OAUTH_SCOPE = "repo read:user"
