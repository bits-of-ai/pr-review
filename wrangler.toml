name = "pr-review"
main = "src/index.js"
compatibility_date = "2026-05-03"

# Git-connected Cloudflare projects run `npx wrangler deploy`.
# Static UI is public/; API routes are handled by src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Public values. Put secrets in the Cloudflare dashboard:
#   GITHUB_CLIENT_SECRET, ANTHROPIC_API_KEY, OPENAI_API_KEY
[vars]
GITHUB_CLIENT_ID = ""
OAUTH_SCOPE = "repo read:user"
